<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Banner Generator Gratisan</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #f0f2f5; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: inline-block; max-width: 500px; width: 100%; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background: #0078d4; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #005a9e; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 30px; max-width: 500px; margin-left: auto; margin-right: auto; }
        .banner-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        canvas { width: 100%; height: auto; border-radius: 4px; display: none; }
        img { width: 100%; height: auto; border-radius: 4px; border: 1px solid #eee; }
        h3 { margin-top: 0; color: #333; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Banner Generator Lokal</h2>
        <p style="color: #666; font-size: 14px;">Semua proses terjadi di browser Anda. 100% Hemat Kuota.</p>
        
        <input type="file" id="upload" accept="image/*">
        <input type="text" id="text-promo" value="DISKON 50% HARI INI!">
        <button id="btn-generate">Generate Banner</button>
    </div>

    <div class="grid">
        <div class="banner-box" id="box-square" style="display: none;">
            <h3>Ukuran Feed Kotak (1080 x 1080)</h3>
            <img id="preview-square" alt="Preview Banner Kotak">
            <button id="btn-download-square" style="background: #107c41;">Download PNG</button>
        </div>
    </div>

    <canvas id="canvas-square" width="1080" height="1080"></canvas>

    <script>
        document.getElementById('btn-generate').addEventListener('click', () => {
            const fileInput = document.getElementById('upload');
            const promoText = document.getElementById('text-promo').value;

            if (fileInput.files.length === 0) {
                alert("Silakan pilih foto produk terlebih dahulu!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            // 1. Membaca file gambar yang diunggah user
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    
                    // --- PROSES GENERATE BANNER 1:1 (KOTAK) ---
                    const canvasSquare = document.getElementById('canvas-square');
                    const ctxSquare = canvasSquare.getContext('2d');

                    // Bersihkan canvas
                    ctxSquare.clearRect(0, 0, 1080, 1080);

                    // A. Gambar foto produk otomatis muat pas di ukuran 1080x1080
                    ctxSquare.drawImage(img, 0, 0, 1080, 1080);

                    // B. Tambahkan overlay gradasi hitam transparan di bawah agar teks terbaca
                    const gradient = ctxSquare.createLinearGradient(0, 800, 0, 1080);
                    gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0.8)');
                    ctxSquare.fillStyle = gradient;
                    ctxSquare.fillRect(0, 800, 1080, 280);

                    // C. Cetak Teks Promosi
                    ctxSquare.fillStyle = "#ffffff"; // Warna teks putih
                    ctxSquare.font = "bold 70px 'Segoe UI', Arial, sans-serif";
                    ctxSquare.textAlign = "center";
                    // Gambar teks di posisi tengah bawah (X: 540, Y: 980)
                    ctxSquare.fillText(promoText, 540, 980);

                    // D. Konversi hasil canvas menjadi gambar asli agar bisa di-download
                    const dataUrlSquare = canvasSquare.toDataURL('image/png');
                    const previewImg = document.getElementById('preview-square');
                    previewImg.src = dataUrlSquare;

                    // Tampilkan box hasil dan aktifkan tombol download
                    document.getElementById('box-square').style.display = 'block';
                    document.getElementById('btn-download-square').onclick = function() {
                        const link = document.createElement('a');
                        link.download = 'banner-kotak-promo.png';
                        link.href = dataUrlSquare;
                        link.click();
                    };
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
